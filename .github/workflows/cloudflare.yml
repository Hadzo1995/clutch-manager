# Builds the game and publishes it on Cloudflare Pages on every push to main.
# This keeps the game online after the repository is made private (GitHub Pages on a free
# plan only serves public repositories).
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   an API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown on the Cloudflare dashboard
# Until both secrets exist this workflow skips the deploy, so nothing breaks.
# The game is then served at https://clutch-manager.pages.dev/
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Cloudflare secrets are not set yet, skipping the Cloudflare deploy."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - if: env.HAS_TOKEN == 'true'
        run: npx vitest run tests/tournament.test.ts tests/squadfull.test.ts tests/beta.test.ts tests/ladder.test.ts
      - if: env.HAS_TOKEN == 'true'
        run: npm run build
      - if: env.HAS_TOKEN == 'true'
        name: Create the Pages project on the first run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create clutch-manager --production-branch=main || true
      - if: env.HAS_TOKEN == 'true'
        name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name=clutch-manager --branch=main --commit-dirty=true
